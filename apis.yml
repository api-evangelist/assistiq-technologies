aid: assistiq-technologies
name: AssistIQ Technologies
description: AssistIQ Technologies builds AI-powered computer vision for the healthcare
  supply chain, automatically capturing the implants, supplies, and tissues used during
  surgical cases in real time so hospitals can bill with confidence. Its platform pairs
  three products - Capture (computer-vision recognition of implants and supplies at
  point of use), Charge Capture (automated charge data submission and review), and
  Insights (analytics on supply variation and utilization) - and integrates with major
  EHR and ERP systems including recognition in the Epic Showroom and a GE HealthCare
  partnership. AssistIQ reports up to an 80% increase in billable product revenue, a
  48% reduction in expiry-related costs, and 15+ minutes saved per case. The platform
  is HIPAA and SOC 2 Type II compliant. The company is a portfolio company of Battery
  Ventures. It does not currently publish a public developer API, documentation portal,
  or machine-readable API description.
